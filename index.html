<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Día de las Flores Amarillas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla 1: Splash -->
  <section id="splash">
    <div class="sky" id="sky"></div>
    <div class="shooting-stars" id="shootingStars"></div>

    <div id="sunflower">
      <div class="glow"></div>
      <svg id="bouquet" viewBox="0 0 300 300">
        <defs>
          <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4a2511"/>
            <stop offset="100%" stop-color="#1a0d05"/>
          </radialGradient>
          <symbol id="sunflowerSymbol" viewBox="-50 -50 100 100">
            <g id="petalsTemplate"></g>
            <circle class="flower-center" cx="0" cy="0" r="17"/>
          </symbol>
        </defs>
        <g id="bouquetGroup"></g>
      </svg>
    </div>
    <p id="cta-text">Toca para iniciar</p>
  </section>

  <!-- Texto fijo -->
  <p id="cta-text2">Para: NIA</p>

  <!-- Pantalla 2: Galaxia 3D -->
  <section id="galaxy" class="hidden">
    <div id="galaxy-canvas"></div>
  </section>

  <!-- Modal de tarjeta -->
  <div id="card-modal" class="hidden">
    <div class="card-wrap">
      <img id="card-img" src="" alt="Tarjeta">
      <button id="card-close">Cerrar 🌻</button>
    </div>
  </div>

  <!-- Destello de transición entre pantallas -->
  <div id="flash-overlay"></div>

  <!-- Librerías Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Tus scripts -->
  <script src="galaxy.js"></script>
  <script src="script.js"></script>
</body>
</html>
